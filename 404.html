<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Chopsticks HQ</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0c; --text: #f2f2f5; --muted: #8b8b9a; --soft: #e8e8ed; --border: #26262e;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --sans: 'Inter', system-ui, sans-serif;
  }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font-family: var(--sans); text-align: center; padding: 24px;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,255,255,.06), transparent 55%);
  }
  .box { position: relative; z-index: 1; max-width: 22rem; }
  h1 {
    font-family: var(--display); font-size: 3.5rem; letter-spacing: -.04em;
    margin-bottom: .35rem; font-weight: 700;
  }
  p { color: var(--muted); margin-bottom: 1.5rem; line-height: 1.5; }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; }
  a {
    display: inline-flex; align-items: center; height: 2.4rem; padding: 0 1.1rem;
    border-radius: 999px; font-size: .875rem; font-weight: 500; text-decoration: none;
    transition: .15s opacity, .15s background;
  }
  .primary { background: var(--soft); color: var(--bg); }
  .primary:hover { opacity: .92; }
  .outline {
    border: 1px solid var(--border); color: var(--text); background: transparent;
  }
  .outline:hover { background: rgba(255,255,255,0.05); }
</style>
</head>
<body>
  <!-- Dead end · still part of the map. Curious explorers sometimes check View Source. -->
  <div class="box">
    <h1>404</h1>
    <p>That page isn’t at Chopsticks HQ.</p>
    <div class="actions">
      <a class="primary" href="/">Home</a>
      <a class="outline" href="/rnitro/">rNitro</a>
      <a class="outline" href="/fathom/">Fathom</a>
      <a class="outline" href="/fathom-pro/">Fathom Pro</a>
    </div>
  </div>
</body>
</html>

[build]
  publish = "."
  # Optional: python3 build-rnitro-mirror.py before deploy (run from CI or locally)

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Same-origin Minecraft status API used by /minecraft/ live telemetry
[[redirects]]
  from = "/api/mc-status"
  to = "/.netlify/functions/mc-status"
  status = 200
  force = true

# Aggregate rNitro download counter shown on /rnitro (no user data stored)
[[redirects]]
  from = "/api/dl-count"
  to = "/.netlify/functions/dl-count"
  status = 200
  force = true

# minecraft.chopstickshq.com → portfolio (same product as /minecraft/)
[[redirects]]
  from = "https://minecraft.chopstickshq.com"
  to = "https://chopstickshq.com/minecraft/"
  status = 301
  force = true

[[redirects]]
  from = "https://minecraft.chopstickshq.com/*"
  to = "https://chopstickshq.com/minecraft/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://minecraft.chopstickshq.com/*"
  to = "https://chopstickshq.com/minecraft/:splat"
  status = 301
  force = true

# Trailing slash for vault directory index (no force — avoids /vault/ loops)
[[redirects]]
  from = "/vault"
  to = "/vault/"
  status = 301

[[headers]]
  for = "/vault"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/vault/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN (not DENY) so /minecraft/ can iframe pixel-bg.html as a page background
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Allow clipboard write for install "Copy" buttons (self only)
    Permissions-Policy = "interest-cohort=(), clipboard-write=(self)"

# Downloadable artifacts — correct types + attachment
[[headers]]
  for = "/rnitro/*.zip"
  [headers.values]
    Content-Type = "application/zip"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/rnitro/*.dmg"
  [headers.values]
    Content-Type = "application/x-apple-diskimage"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/rnitro/*.pkg"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/rnitro/*.sh"
  [headers.values]
    Content-Type = "text/x-shellscript; charset=utf-8"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/rnitro/*.exe"
  [headers.values]
    Content-Type = "application/vnd.microsoft.portable-executable"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/rnitro/*.ps1"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/rnitro/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

# Reviews feed polled by /rnitro every 5 minutes — must never serve stale
[[headers]]
  for = "/rnitro/reviews.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/shaders/*.zip"
  [headers.values]
    Content-Type = "application/zip"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600, must-revalidate"

# ARENA download — same treatment as the other artifacts. must-revalidate
# matters here: the zip is replaced in place at every game update.
[[headers]]
  for = "/arena-fps/*.zip"
  [headers.values]
    Content-Type = "application/zip"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/arena-fps/*.sh"
  [headers.values]
    Content-Type = "text/x-shellscript; charset=utf-8"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600, must-revalidate"

